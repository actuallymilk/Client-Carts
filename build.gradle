plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'maven-publish'
}

def minecraftVersion = stonecutter.current.version
def unobfuscatedMinecraft = minecraftVersion.startsWith('26.')
if (unobfuscatedMinecraft) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
}

version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

if (!unobfuscatedMinecraft) loom {
    mixin {
        defaultRefmapName = 'clientcarts-refmap.json'
        useLegacyMixinAp = true
    }
}

repositories {
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (unobfuscatedMinecraft) {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
        compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
        modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'java_version', project.java_version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version,
                java_version: project.java_version
    }

    if (unobfuscatedMinecraft) doLast {
        def mixinFile = destinationDir.toPath().resolve('clientcarts.mixins.json').toFile()
        def mixinConfig = new groovy.json.JsonSlurper().parse(mixinFile)
        mixinConfig.remove('refmap')
        mixinConfig.compatibilityLevel = 'JAVA_25'
        mixinFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(mixinConfig)) + '\n'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(project.java_version as int)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "LICENSE_${project.archives_base_name}" }
    }
}

def distributableJar = tasks.named(unobfuscatedMinecraft ? 'jar' : 'remapJar')
tasks.register('buildAndCollect', Copy) {
    group = 'build'
    dependsOn distributableJar
    from distributableJar.flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('libs')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}